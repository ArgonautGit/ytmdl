# cargo-about settings for tools/gen-notices: the Rust crates in the Android
# app. Where a crate offers a choice of licenses, the first one listed here
# that it offers is the one its notice shows.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "Unlicense",
    "0BSD",
    "MIT-0",
    "CC0-1.0",
    "BSL-1.0",
]
targets = ["aarch64-linux-android"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Our own crates (GPL-3.0-or-later) are covered by the page's first entry.
private = { ignore = true }
