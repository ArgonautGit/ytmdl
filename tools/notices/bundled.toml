# Third-party code in the APK besides the Rust crates (which tools/gen-notices
# gets from cargo-about). `texts` are files beside this one, copied from each
# project's release:
#   python.txt      CPython v3.14.7 LICENSE, then Doc/license.rst's
#                   "Licenses and Acknowledgements for Incorporated Software"
#                   as plain text (covers expat, libffi, libmpdec and more)
#   openssl.txt     openssl-3.5.7 LICENSE.txt
#   sqlite.txt      the notice at the top of sqlite3.h
#   bzip2.txt       bzip2-1.0.8 LICENSE
#   xz.txt          xz v5.4.6 COPYING
#   zstd.txt        zstd v1.5.7 LICENSE
#   yt-dlp.txt      yt-dlp 2026.08.19 LICENSE
#   yt-dlp-ejs.txt  yt-dlp/ejs 0.8.0 LICENSE
#   meriyah.txt, astring.txt
#                   the notices bundled in yt-dlp-ejs's lib.min.js
#   quickjs-ng.txt  quickjs-ng v0.17.0 LICENSE
#   apache-2.0.txt  https://www.apache.org/licenses/LICENSE-2.0.txt
#
# `pin` names a version setting in another file; tools/gen-notices fails when
# the two differ, since the texts may need updating with the version.

[[group]]
title = "Bundled software"

[[group.item]]
name = "Python"
version = "3.14.7"
pin = ["tools/fetch-deps", "PYTHON_VERSION"]
license = "PSF-2.0"
by = "Python Software Foundation"
url = "https://www.python.org"
texts = ["python.txt"]

