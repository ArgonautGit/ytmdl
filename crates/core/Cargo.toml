[package]
name = "ytmdl-core"
description = "Search and download music from YouTube via an embedded yt-dlp"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pyo3.workspace = true
serde.workspace = true
serde_json.workspace = true
lofty.workspace = true
# Loudness measurement (ReplayGain): decoding M4A's AAC, and EBU R128.
symphonia = { version = "0.6", default-features = false, features = ["aac", "isomp4", "opt-simd"] }
ebur128 = "0.1"
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
