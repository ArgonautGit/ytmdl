[workspace]
resolver = "3"
members = ["crates/core", "crates/library", "crates/cli", "crates/smoke", "app"]
# The app needs WebKitGTK on desktop and dx for Android; build it explicitly.
default-members = ["crates/core", "crates/library", "crates/cli", "crates/smoke"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
repository = "https://github.com/ArgonautGit/ytmdl"

[workspace.dependencies]
ytmdl-core = { path = "crates/core" }
ytmdl-library = { path = "crates/library" }
pyo3 = { version = "0.29", default-features = false, features = ["macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.25"
thiserror = "2"
tokio = { version = "1", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.dev]
debug = 1

[profile.release]
debug = "line-tables-only"
