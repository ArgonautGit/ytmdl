[package]
name = "ytmdl-app"
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
repository.workspace = true

[dependencies]
dioxus = { version = "=0.7.9" }
ytmdl-core.workspace = true
ytmdl-library.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
# Logs to logcat and to apkd, which builds the app (its README, "Logs from apps").
apkd-log = { git = "ssh://git@github.com/ArgonautGit/apkd.git" }
jni = "0.21"
ndk-context = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
# Static HTML of every screen for browser previews (src/ui/preview.rs).
dioxus-ssr = "=0.7.9"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
# Honour the `ytmdl_autotest` launch extra / YTMDL_AUTOTEST (test builds only).
autotest = []
